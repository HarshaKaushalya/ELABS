name: elabs

services:
  mysql:
    image: mysql:8.4
    container_name: elabs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabs}
      MYSQL_USER: ${MYSQL_USER:-elabs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elabs_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    container_name: elabs-api
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-elabs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elabs_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabs}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: localhost
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    container_name: elabs-web
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE: http://localhost:4000
      NEXT_PUBLIC_VISION_BASE: http://localhost:8002
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  ai:
    container_name: elabs-ai
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      LOG_LEVEL: INFO
      API_BASE_URL: http://api:4000
    ports:
      - "${AI_PORT:-8001}:8000"
    depends_on:
      - api

  vision:
    container_name: elabs-vision
    build:
      context: .
      dockerfile: infra/docker/vision.Dockerfile
    environment:
      VISION_HOST: 0.0.0.0
      VISION_PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "${VISION_PORT:-8002}:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: elabs-nginx
    depends_on:
      - web
      - api
      - ai
      - vision
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/sites/elabs.conf:/etc/nginx/conf.d/elabs.conf:ro

volumes:
  mysql_data:
