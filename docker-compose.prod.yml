name: elabs-prod

services:
  mysql:
    image: mysql:8.4
    container_name: elabs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elabs_root_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabs}
      MYSQL_USER: ${MYSQL_USER:-elabs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elabs_password_2026}
    ports:
      # Expose only to host loopback to prevent external attacks
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-elabs_root_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    container_name: elabs-api
    restart: always
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-elabs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elabs_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabs}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-elabs_prod_jwt_access_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-elabs_prod_jwt_refresh_secret_key_2026}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    container_name: elabs-web
    restart: always
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_VISION_BASE: /vision
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_VISION_BASE: /vision
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: elabs-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/sites/elabs.conf:/etc/nginx/conf.d/elabs.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
      - api

  # Optional microservices (only started with --profile full)
  ai:
    profiles: ["full"]
    container_name: elabs-ai
    restart: always
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      LOG_LEVEL: INFO
      API_BASE_URL: http://api:4000
    depends_on:
      - api

  vision:
    profiles: ["full"]
    container_name: elabs-vision
    restart: always
    build:
      context: .
      dockerfile: infra/docker/vision.Dockerfile
    environment:
      VISION_HOST: 0.0.0.0
      VISION_PORT: 8000
      LOG_LEVEL: INFO

volumes:
  mysql_prod_data:
  certbot_etc:
  certbot_var:
  certbot_www:
