upstream elabs_web    { server web:3000; }
upstream elabs_api    { server api:4000; }
upstream elabs_ai     { server ai:8000; }
upstream elabs_vision { server vision:8000; }

server {
  listen 80;
  server_name _;

  # Allow large video uploads (200 MB)
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://elabs_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ai/ {
    proxy_pass http://elabs_ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /vision/ {
    proxy_pass http://elabs_vision/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Video analysis can take several minutes — extend timeouts
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;
  }

  location / {
    proxy_pass http://elabs_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}