upstream elabs_web { 
  server web:3000; 
}

upstream elabs_api { 
  server api:4000; 
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Allow large uploads (practical guides, attachments, video)
  client_max_body_size 200m;

  # Docker internal DNS resolver for optional microservices
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Let's Encrypt / Certbot challenge directory
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # REST API Gateway
  location /api/ {
    proxy_pass http://elabs_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Real-time WebSockets (Socket.IO notifications & chat)
  location /socket.io/ {
    proxy_pass http://elabs_api/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Python AI Assistant Service (Dynamic upstream)
  location /ai/ {
    set $upstream_ai http://ai:8000;
    proxy_pass $upstream_ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Python Computer Vision Service (Dynamic upstream & WebSocket stream)
  location /vision/ {
    set $upstream_vision http://vision:8000;
    proxy_pass $upstream_vision/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Extended timeouts for video processing
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 60s;
  }

  # Next.js Web Portal (Catch-all frontend routes)
  location / {
    proxy_pass http://elabs_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}